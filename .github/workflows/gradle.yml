name: Kotlin CI with Gradle

on:
  push:
    branches:
      - master
    paths:
      - 'rebar/**'
      - 'nms/**'
      - 'test/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
  pull_request:
    branches: [ "*" ]
    paths:
      - 'rebar/**'
      - 'nms/**'
      - 'test/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
  workflow_call:
    inputs:
      version:
        default: ${{ github.run_number }}
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.2

      - name: Verify Minecraft 26.2 port
        run: python3 scripts/verify_26_2_port.py

      - name: Build with Gradle Wrapper
        run: ./gradlew :rebar:shadowJar -Pversion=${{ inputs.version || github.run_number }}

      - name: Upload the artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: rebar-${{ inputs.version || github.run_number }}
          path: 'rebar/build/libs/rebar-${{ inputs.version || github.run_number }}.jar'

  dependency-submission:
    needs: [ build ]

    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4.2.2

  test-build:
    needs: [ build ]
    uses: ./.github/workflows/live-testing.yml
