name: Build Rebar 26.2 Test JAR

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebar-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rebar test JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_VERSION: 0.42.1-26.2-test.${{ github.run_number }}

    steps:
      - name: Checkout Rebar
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Minecraft 26.2 port
        run: python3 scripts/verify_26_2_port.py

      - name: Build Rebar test JAR
        run: ./gradlew --no-daemon clean :rebar:shadowJar -Pversion="$TEST_VERSION"

      - name: Verify JAR exists
        run: |
          JAR="rebar/build/libs/rebar-${TEST_VERSION}.jar"
          test -f "$JAR"
          echo "Built: $JAR"
          ls -lh "$JAR"

      - name: Upload Rebar JAR directly
        uses: actions/upload-artifact@v7
        with:
          path: rebar/build/libs/rebar-${{ env.TEST_VERSION }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
